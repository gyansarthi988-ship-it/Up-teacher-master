name: Temporary Source Audit
on:
  push:
    branches: [audit/admin-auth-source]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract and inspect project source
        shell: bash
        run: |
          set -e
          ZIP="$(find . -type f -name 'UP_Teacher_Master_Launch_Files.zip' -print -quit)"
          test -n "$ZIP"
          mkdir -p /tmp/upteacher
          unzip -q "$ZIP" -d /tmp/upteacher
          ROOT="$(find /tmp/upteacher -type f -path '*/admin/app/page.tsx' -print -quit | sed 's#/admin/app/page.tsx##')"
          test -n "$ROOT"
          {
            echo "SOURCE_ROOT=$ROOT"
            echo "===== ADMIN PAGE ====="
            sed -n '1,240p' "$ROOT/admin/app/page.tsx"
            echo "===== SUPABASE CLIENT ====="
            sed -n '1,180p' "$ROOT/admin/lib/supabase.ts"
            echo "===== PACKAGE ====="
            cat "$ROOT/admin/package.json"
            echo "===== ROLE SQL ====="
            grep -RniE 'create.*function.*is_admin|function.*has_role|create table.*user_roles|super_admin|ADMIN_BOOTSTRAP' "$ROOT/supabase" "$ROOT/docs" 2>/dev/null | head -300 || true
            echo "===== ADMIN WORKFLOW ====="
            sed -n '1,220p' "$ROOT/.github/workflows/admin-check.yml" 2>/dev/null || true
          } > "$GITHUB_WORKSPACE/source-admin-auth-details.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: source-admin-auth-details
          path: source-admin-auth-details.txt
          retention-days: 3
