name: Temporary Source Audit
on:
  push:
    branches: [audit/admin-auth-source]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract and inspect project source
        shell: bash
        run: |
          set -e
          mkdir -p /tmp/upteacher
          unzip -q UP_Teacher_Master_Launch_Files.zip -d /tmp/upteacher
          cd /tmp/upteacher/UP_Teacher_Master
          {
            for f in admin/app/page.tsx admin/lib/supabase.ts admin/package.json mobile/lib/screens/auth_screen.dart mobile/lib/screens/profile_screen.dart supabase/migrations/0001_phase1_foundation.sql supabase/migrations/0020_username_registration.sql; do
              if [ -f "$f" ]; then
                echo "===== $f ====="
                sed -n '1,260p' "$f"
                echo
              fi
            done
            echo "===== ROLE / ADMIN SQL ====="
            grep -RniE 'create.*function.*is_admin|function.*has_role|create table.*user_roles|super_admin|ADMIN_BOOTSTRAP' supabase docs 2>/dev/null | head -400 || true
          } > source-admin-auth-details.txt
      - uses: actions/upload-artifact@v4
        with:
          name: source-admin-auth-details
          path: source-admin-auth-details.txt
          retention-days: 3
